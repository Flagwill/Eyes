<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MIO Agent Eyes</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <main class="overlay" id="overlay" aria-live="polite">
    <div class="wallpaper-frame" aria-hidden="true">
      <img class="wallpaper" id="wallpaper" alt="">
    </div>
    <div class="fallback-wallpaper" aria-hidden="true"></div>
    <div class="frost" aria-hidden="true"></div>
    <div class="ambient ambient-left" aria-hidden="true"></div>
    <div class="ambient ambient-right" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section class="presence" aria-label="MIO Agent 当前状态">
      <div class="eye-stage">
        <canvas id="eyes" role="img" aria-label="待命中的紫色双眼"></canvas>
      </div>
      <div class="status-copy">
        <div class="eyebrow"><i></i><span id="eyebrow">MIO 桌面上线</span></div>
        <h1 id="title">随时准备出发</h1>
        <p id="detail">收到任务后，我会在这里工作</p>
      </div>
    </section>

    <div class="corner-mark top-left" aria-hidden="true"><i></i><span>AGENT PRESENCE</span></div>
    <div class="corner-mark top-right" aria-hidden="true"><span>MIO</span><i></i></div>
    <div class="bottom-signal" aria-hidden="true">
      <span class="signal-line"></span>
      <span>DESKTOP HARNESS · LIVE</span>
      <span class="signal-line"></span>
    </div>
  </main>

  <script type="module" src="desktop.js"></script>
</body>
</html>

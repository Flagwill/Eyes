<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eyes — 八种表情对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f0f7; color: #40324e; font: 14px system-ui,sans-serif; }
    main { max-width: 1400px; margin: auto; padding: 22px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0 0 5px; font-size: 23px; }
    p { margin: 0; color: #87798f; font-size: 12px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button,a { font: inherit; font-size: 12px; color: #6e4c91; background: #fff; border: 1px solid #ddd1e9; border-radius: 8px; padding: 9px 12px; text-decoration: none; cursor: pointer; }
    button[aria-pressed=true] { background: #e7dcf3; border-color: #a98bca; }
    #faces { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    article { min-width: 0; overflow: hidden; border: 1px solid #e1dbe9; border-radius: 12px; background: linear-gradient(135deg,#eae5f0,#dfdce7); }
    canvas { display: block; width: 100%; height: 220px; }
    h2 { font-size: 13px; font-weight: 500; text-align: center; margin: 0; padding: 3px 0 14px; }
    body.no-labels h2 { visibility: hidden; }
    footer { font-size: 11px; color: #94899c; margin-top: 15px; text-align: center; }
    @media(max-width:1000px) { #faces { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; } canvas { height: 132px; } h2 { padding-bottom: 10px; } main { padding: 16px; } }
    @media(max-width:480px) { header { align-items:flex-start; flex-direction:column; } h1 { font-size:20px; } canvas { height:116px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>八种表情，同一双眼睛。</h1><p>观察眼睑、眉线、小道具与视线，比较每一种情绪。</p></div>
      <nav aria-label="对照控制"><a id="catalog" href="gallery.html?view=activities">查看二十种工作状态</a><button id="replay">重播表情</button><button id="motion" aria-pressed="true">暂停表情动作</button><button id="labels" aria-pressed="false">隐藏名称</button><a href="/">返回调试台</a></nav>
    </header>
    <section id="faces" aria-label="八种表情"></section>
    <footer>Eyes · 同尺寸表情对照 · 点击单个画面眨眼</footer>
  </main>
  <script type="module" src="gallery.js"></script>
</body>
</html>
